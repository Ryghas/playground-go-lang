name: pokemon-service

on:
  push:
    branches: [main]
    paths:
      - "pokemon-service/**"
      - ".github/workflows/pokemon-service.yml"
  pull_request:
    paths:
      - "pokemon-service/**"
      - ".github/workflows/pokemon-service.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pokemon-service

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pokemon-service/go.mod
          cache-dependency-path: pokemon-service/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: pokemon-service

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pokemon-service/go.mod
          cache-dependency-path: pokemon-service/go.sum
      - name: Unit test
        run: go test ./... -race -count=1 -cover

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokemon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pokemon"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pokemon-service/go.mod
          cache-dependency-path: pokemon-service/go.sum
      - name: Integration test (Postgres)
        env:
          TEST_DATABASE_DSN: host=localhost port=5432 user=postgres password=postgres dbname=pokemon sslmode=disable
        run: go test -tags=integration ./internal/repository/... -race -count=1 -v

  swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pokemon-service/go.mod
          cache-dependency-path: pokemon-service/go.sum
      - name: Generate ulang dokumentasi Swagger
        run: make swag
      - name: Pastikan docs/ sudah ter-commit dan up to date
        run: |
          if ! git diff --exit-code -- .; then
            echo "::error::Dokumentasi Swagger belum di-generate ulang. Jalankan 'make swag' lalu commit hasilnya."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pokemon-service:ci .
